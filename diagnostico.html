<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico de Churn</title>
<meta name="description" content="Painel de diagnóstico de churn para CS: retenção, onde está o churn, sinais nos KPIs, qualidade do score e lista de ação, com o passo a passo de cada análise.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: narrativa em páginas (abas numeradas); cada página abre com a conclusão e desce para o "como chegamos aqui". Visual escuro de sala de diagnóstico, por escolha. */
:root {
  --bg: #0d0f22;
  --surface: #151833;
  --raise: #1d2140;
  --ink: #eceefa;
  --muted: #a9adc8;
  --faint: #8d91ad;
  --line: #2a2e4d;
  --accent: #9d94ff;
  --accent-ink: #12142a;
  --ativo: #3987e5;
  --canc: #e2692f;
  --crit: #e66767;
  --warn: #fab219;
  --c3: #199e70; --c4: #c98500; --c5: #9085e9;
  --f-display: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(1200px 500px at 85% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(900px 400px at -10% 110%, color-mix(in srgb, var(--canc) 9%, transparent), transparent 70%); }
.wrap { position: relative; max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 72px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: clamp(2rem, 4.4vw, 3.2rem); line-height: 1.02; font-weight: 800; }
h2 { font-size: clamp(1.5rem, 2.6vw, 2rem); line-height: 1.12; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--f-mono); font-size: 0.82em; color: var(--ink); background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, select, input { font: inherit; color: inherit; }

.head { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; justify-content: space-between; padding-bottom: 18px; }
.head .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pill { font-family: var(--f-mono); font-size: 0.74rem; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); background: color-mix(in srgb, var(--surface) 80%, transparent); }
.pill.sample { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; color: var(--ink); font-weight: 500; font-size: 0.9rem; min-height: 40px; }
.btn:hover { border-color: var(--accent); }

nav.pages { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-block: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.pages-in { display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.pages-in::-webkit-scrollbar { display: none; }
.pg { border: 0; background: none; cursor: pointer; padding: 13px 12px 11px; color: var(--muted); font-weight: 600; font-size: 0.9rem; white-space: nowrap; border-bottom: 2px solid transparent; display: flex; gap: 8px; align-items: center; min-height: 44px; }
.pg b { font-family: var(--f-mono); font-size: 0.72rem; color: var(--faint); font-weight: 500; }
.pg[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pg[aria-selected="true"] b { color: var(--accent); }
.pg:hover { color: var(--ink); }

.page { display: grid; gap: 28px; padding-top: 32px; }
.page-head { display: grid; gap: 10px; max-width: 80ch; }
.lead { font-size: 1.1rem; color: var(--ink); line-height: 1.55; }
.lead b { color: var(--accent); font-weight: 600; }
.bad { color: var(--canc); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.card > *, .grid > * { min-width: 0; }
.tbl-btn { justify-self: end; border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; cursor: pointer; min-height: 30px; }
.tbl-btn:hover, .tbl-btn[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
.tbl-view table { font-size: 0.82rem; }
.sortbar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 0.82rem; }
.pick { min-height: 1.4em; font-size: 0.88rem; color: var(--ink); }
.cut { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; color: var(--muted); }
.cut input[type=range] { flex: 1; max-width: 260px; accent-color: var(--accent); }
.cut output { font-family: var(--f-mono); font-weight: 600; color: var(--ink); font-size: 1rem; min-width: 2ch; }
.cut-res { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.cut-res div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; background: var(--bg); }
.cut-res b { font-family: var(--f-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.cut-res span { font-size: 0.76rem; color: var(--muted); }
.card-h { display: flex; justify-content: space-between; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; }
.card-h p { font-size: 0.84rem; }
.chart { position: relative; height: 280px; }
.chart.sm { height: 170px; }
.chart.lg { height: 340px; }
.note { font-size: 0.8rem; color: var(--muted); }
.next { justify-self: end; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 4px; position: relative; overflow: hidden; align-content: start; }
.kpi .k { font-size: 0.8rem; color: var(--muted); }
.kpi .v { font-family: var(--f-display); font-size: clamp(1.8rem, 3vw, 2.4rem); font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .s { font-size: 0.8rem; color: var(--muted); }
.kpi.alert .v { color: var(--crit); }
.kpi.alert::after { content: ""; position: absolute; right: 16px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 0 color-mix(in srgb, var(--crit) 60%, transparent); animation: pulse 2.2s 3; }
@keyframes pulse { 70% { box-shadow: 0 0 0 12px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

.flow { display: flex; align-items: stretch; overflow-x: auto; padding: 4px 2px 8px; }
.node { flex: 1 0 130px; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; opacity: 0; transform: translateY(8px); animation: rise .5s ease forwards; }
.node .v { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.node .k { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
.node .tag { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
.node.split { gap: 10px; }
.conn { flex: 0 0 38px; align-self: center; height: 3px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--accent) 0 8px, transparent 8px 14px); background-size: 28px 3px; animation: dash 1.1s linear 5; opacity: .85; }
@keyframes dash { to { background-position: 28px 0; } }
@keyframes rise { to { opacity: 1; transform: none; } }

.finds { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 14px; }
.find { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transform: translateY(10px); animation: rise .55s ease forwards; }
.find .top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.find .big { font-family: var(--f-display); font-size: 2.1rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.find .big small { font-family: var(--f-body); font-size: 0.8rem; font-weight: 500; color: var(--muted); display: block; margin-top: 4px; }
.find p { color: var(--muted); font-size: 0.9rem; }
.find > .btn { margin-top: auto; align-self: flex-start; }
.find p b { color: var(--ink); font-weight: 600; }
.tagc { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); white-space: nowrap; }
.tagc.red { background: color-mix(in srgb, var(--crit) 16%, transparent); color: #f08f8f; }
.tagc.yel { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

.stepper { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; display: grid; gap: 8px; }
.st-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.st-top span { font-family: var(--f-mono); font-size: 0.7rem; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }
.st-ctrl { display: flex; gap: 4px; }
.st-ctrl button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; color: var(--muted); display: grid; place-items: center; padding: 0; }
.st-ctrl button:hover { color: var(--ink); border-color: var(--accent); }
.st-bars { display: flex; gap: 4px; }
.st-bars i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; position: relative; }
.st-bars i.done::after { content: ""; position: absolute; inset: 0; background: var(--accent); }
.st-bars i.cur::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform-origin: left; animation: fill 3.2s linear forwards; }
.stepper.paused .st-bars i.cur::after { animation-play-state: paused; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.st-body { min-height: 70px; display: grid; gap: 4px; }
.st-body h4 { margin: 0; font-size: 0.88rem; }
.st-body h4 em { font-style: normal; color: var(--accent); font-family: var(--f-mono); font-size: 0.78rem; margin-right: 6px; }
.st-body pre { margin: 0; font-family: var(--f-mono); font-size: 0.76rem; color: var(--ink); white-space: pre-wrap; line-height: 1.5; }
.st-body p { font-size: 0.82rem; }
.st-anim { animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; transform: none; } }

details.how { border-top: 1px dashed var(--line); padding-top: 10px; }
details.how summary { cursor: pointer; color: var(--accent); font-size: 0.84rem; font-weight: 600; list-style: none; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::before { content: "＋ "; }
details.how[open] summary::before { content: "－ "; }
details.how ol { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); font-size: 0.84rem; }
details.how ol b { color: var(--ink); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipb { border: 1px solid var(--line); background: var(--bg); color: var(--muted); padding: 6px 12px; border-radius: 99px; cursor: pointer; font-size: 0.84rem; min-height: 34px; }
.chipb[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
th { text-align: left; font-weight: 600; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.heat { width: auto; }
table.heat td.cell { width: 54px; min-width: 54px; text-align: center; font-family: var(--f-mono); font-size: 0.74rem; border: 2px solid var(--surface); border-radius: 5px; padding: 6px 2px; opacity: 0; animation: rise .4s ease forwards; }
table.heat td.na { color: var(--faint); text-align: center; }
.ramp { display: inline-block; width: 140px; height: 8px; border-radius: 2px; vertical-align: middle; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 0.8rem; color: var(--muted); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tools input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: min(100%, 260px); min-height: 40px; }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--ink); }
th.sort[aria-sort="ascending"]::after { content: " ▲"; color: var(--accent); }
th.sort[aria-sort="descending"]::after { content: " ▼"; color: var(--accent); }
tbody tr:hover td { background: color-mix(in srgb, var(--raise) 70%, transparent); }
td .sub { display: block; color: var(--muted); font-size: 0.76rem; }
td.one { white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.score { display: inline-flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.score i { width: 52px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative; }
.score i b { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.chip { display: inline-flex; gap: 5px; align-items: center; font-size: 0.74rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.chip.crit { background: #d1344a; color: #fff; border-radius: 4px; }
.chip.warn { background: #fdab3d; color: #1f2240; border-radius: 4px; }

.anoms { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.anom { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg); display: grid; gap: 6px; position: relative; overflow: hidden; align-content: start; }
.anom::before { content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 40%; background: linear-gradient(90deg, transparent, var(--crit), transparent); animation: scan 3.2s ease-in-out 3; }
@keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
.anom h3 { font-size: 0.98rem; }
.anom .row { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.anom .q { font-size: 0.84rem; }
.anom .k { font-size: 0.78rem; color: var(--muted); }

.bars { display: grid; gap: 8px; }
.barline { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 52px; gap: 10px; align-items: center; font-size: 0.85rem; }
.barline .t { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.barline .t b { display: block; height: 100%; border-radius: 4px; width: 0; transition: width .9s ease; }
.barline .p { text-align: right; font-family: var(--f-mono); font-size: 0.78rem; }
pre.cmd { margin: 0; font-family: var(--f-mono); font-size: 0.8rem; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.steps-line { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; counter-reset: s; }
.steps-line div { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); font-size: 0.84rem; color: var(--muted); }
.steps-line div::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 600 0.76rem var(--f-mono); margin-bottom: 8px; }
.steps-line b { color: var(--ink); display: block; margin-bottom: 2px; }

.driver-popover.csops-tour .driver-popover-title { font-family: var(--f-display); font-size: 1.08rem; font-weight: 700; color: var(--ink); }

  wrap.hidden = !on; box.hidden = on; b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "Ver como gráfico" : "Ver como tabela";
});
// mira vertical em gráficos de linha
const crosshair = { id: "crosshair", afterDraw(ch) { const a = ch.tooltip && ch.tooltip.getActiveElements(); if (!a || !a.length || ch.config.type !== "line") return; const x = a[0].element.x, { top, bottom } = ch.chartArea, g = ch.ctx; g.save(); g.strokeStyle = C.muted; g.globalAlpha = .6; g.lineWidth = 1; g.beginPath(); g.moveTo(x, top); g.lineTo(x, bottom); g.stroke(); g.restore(); } };
Chart.register(crosshair);
const pctAxis = max => ({ beginAtZero: true, max, ticks: { callback: v => nf(v * 100) + "%" }, grid: { color: C.line } });

/* ---------- stepper "como chegamos aqui" ---------- */
let stepperSeq = 0;
function stepper(steps) {
  return `<div class="stepper" id="st${++stepperSeq}" data-steps="${esc(JSON.stringify(steps))}" tabindex="0" aria-label="Como chegamos aqui, passo a passo">
    <div class="st-top"><span>Como chegamos aqui</span><div class="st-ctrl"><button type="button" data-st="prev" aria-label="Passo anterior">‹</button><button type="button" data-st="play" aria-label="Pausar">❚❚</button><button type="button" data-st="next" aria-label="Próximo passo">›</button></div></div>
    <div class="st-bars">${steps.map(() => "<i></i>").join("")}</div>
    <div class="st-body" aria-live="off"></div>
  </div>`;
}
function initSteppers(root) {
  root.querySelectorAll(".stepper").forEach(el => {
    const steps = JSON.parse(el.dataset.steps), bars = [...el.querySelectorAll(".st-bars i")], body = el.querySelector(".st-body"), play = el.querySelector('[data-st="play"]');
    let i = 0, paused = REDUCED;
    const show = n => {
      i = (n + steps.length) % steps.length;
      bars.forEach((b, j) => { b.className = j < i ? "done" : j === i ? "cur" : ""; });
      body.innerHTML = `<div class="st-anim"><h4><em>${i + 1}/${steps.length}</em>${esc(steps[i].t)}</h4>${steps[i].calc ? `<pre>${esc(steps[i].calc)}</pre>` : ""}${steps[i].p ? `<p class="muted">${esc(steps[i].p)}</p>` : ""}</div>`;
    };
    bars.forEach(b => b.addEventListener("animationend", () => { if (!paused) show(i + 1); }));
    const setPause = v => { paused = v; el.classList.toggle("paused", v); play.textContent = v ? "▶" : "❚❚"; play.setAttribute("aria-label", v ? "Reproduzir" : "Pausar"); };
    el.addEventListener("mouseenter", () => el.classList.add("paused"));
    el.addEventListener("mouseleave", () => { if (!paused) el.classList.remove("paused"); });
    el.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; body.setAttribute("aria-live", "polite"); if (b.dataset.st === "prev") { setPause(true); show(i - 1); } else if (b.dataset.st === "next") { setPause(true); show(i + 1); } else setPause(!paused); });
    el.addEventListener("keydown", e => { body.setAttribute("aria-live", "polite"); if (e.key === "ArrowRight") { setPause(true); show(i + 1); } if (e.key === "ArrowLeft") { setPause(true); show(i - 1); } });
    setPause(paused); show(0);
  });
}

/* ---------- números que contam ---------- */
function countUp(root) {
  root.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, fmt = el.dataset.fmt || "int", f = v => fmt === "pct" ? pct(v, +(el.dataset.d || 1)) : fmt === "brl" ? brl(v) : nf(v);
    if (REDUCED) { el.textContent = f(to); return; }
    const t0 = performance.now(), dur = 1100;
    const tick = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = f(k < 1 ? to * e : to); if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

/* ---------- achados automáticos ---------- */
function findings() {
  const F = [];
  const seg = D.profiles.flatMap(p => p.rows.filter(r => r.z >= 1.96 && r.n >= 5).map(r => ({ ...r, dim: p.label }))).sort((a, b) => b.z - a.z)[0];
  if (seg) F.push({ tag: "Onde", big: pct(seg.r), small: `${seg.dim}: ${seg.k}`, text: `<b>${esc(seg.k)}</b> cancela ${pct(seg.r)} contra ${pct(K.rate)} da base. É a maior diferença entre os perfis que não se explica por acaso.`, page: "onde",
    steps: [{ t: `Agrupar as ${lvl} por ${seg.dim.toLowerCase()}`, calc: `${seg.k}: ${seg.n} ${lvl}` }, { t: "Taxa do grupo", calc: `${seg.ch} canceladas ÷ ${seg.n} = ${pct(seg.r)}` }, { t: "Taxa da base", calc: `${K.churned} ÷ ${K.base} = ${pct(K.rate)}` }, { t: "Teste z: acaso ou não?", calc: `z = (${nf(seg.r, 3)} − ${nf(K.rate, 3)}) ÷ √(${nf(K.rate, 3)} × ${nf(1 - K.rate, 3)} ÷ ${seg.n})\n  = ${nf(seg.z, 2)}`, p: "Acima de 1,96, a chance de ser acaso é menor que 5%." }] });
  const k = D.kpiStats.find(s => s.w > 0);
  if (k) { const tr = D.trajectory[k.col], first = tr ? tr.canc.find(v => v != null) : null, last = tr ? tr.canc[5] : null;
    F.push({ tag: "Sinal", big: nf(Math.abs(k.d), 2), small: `efeito de ${k.label}`, text: `<b>${esc(k.label)}</b> é o KPI que mais separa quem cancela: mediana ${nf(k.b[2], 1)} nas canceladas contra ${nf(k.a[2], 1)} nas ativas${first != null && last != null ? `, e vai de ${nf(first, 1)} para ${nf(last, 1)} nos 6 meses antes da saída` : ""}.`, page: "sinais",
      steps: [{ t: "Última leitura de cada KPI antes do cancelamento", p: "Para ativas, a leitura mais recente." }, { t: "Comparar os dois grupos", calc: `ativas:     mediana ${nf(k.a[2], 1)} (n=${k.na})\ncanceladas: mediana ${nf(k.b[2], 1)} (n=${k.nb})` }, { t: "Efeito (d de Cohen)", calc: `d = (média cancel. − média ativas) ÷ desvio combinado\n  = (${nf(k.mb, 1)} − ${nf(k.ma, 1)}) ÷ … = ${nf(k.d, 2)}`, p: "Acima de 0,8 é um efeito grande." }, ...(tr && first != null ? [{ t: "Trajetória até a saída", calc: `6 meses antes: ${nf(first, 1)}\n1 mês antes:   ${nf(last, 1)}` }] : [])] }); }
  if (D.quality) { const q = D.quality, top = q.deciles[0], lift = top.n ? (top.ch / top.n) / K.rate : null;
    F.push({ tag: "Score", big: nf(q.auc, 2), small: "AUC do score de risco", text: `O score ordena bem o risco: os <b>10% com score mais alto</b> concentram ${pct(top.ch / top.n, 0)} de cancelamento, ${nf(lift, 1)}× a média da base.`, page: "score",
      steps: [{ t: `Score de cada ${one}`, p: `Média ponderada dos percentis nos KPIs, contra ativas do mesmo ${(D.peerDim || "perfil").toLowerCase()}.` }, { t: "Ordenar do maior para o menor", calc: `${q.P + q.N} ${lvl} com score` }, { t: "Churn no primeiro décimo", calc: `${top.ch} ÷ ${top.n} = ${pct(top.ch / top.n)}  (base ${pct(K.rate)})` }, { t: "AUC", calc: `chance de uma cancelada ter score maior\nque uma ativa sorteada = ${nf(q.auc, 2)}`, p: "0,5 seria sorteio; 1 seria perfeito." }] }); }
  if (K.scoredChurned) { const ab = D.reasons.filter(r => r.anormal).sort((a, b) => b.anormal - a.anormal);
    F.push({ tag: "Alerta", red: true, big: nf(K.anormal), small: `${pct(K.anormal / K.scoredChurned, 0)} dos cancelamentos`, text: `<b>${K.anormal} ${lvl}</b> cancelaram com indicadores saudáveis. Motivos mais comuns nesses casos: ${esc(ab.slice(0, 2).map(r => r.k).join(" e ") || "—")}.`, page: "acao",
      steps: [{ t: "Score da cancelada contra as ativas pares", p: "Com a última leitura antes do cancelamento." }, { t: `Score abaixo de ${CUT.anormal} = anormal`, calc: `${K.anormal} anormais · ${K.fraco} com sinais fracos · ${K.esperado} esperados` }, { t: "Cruzar com o motivo", calc: ab.slice(0, 3).map(r => `${r.k}: ${r.anormal}`).join("\n") || "—" }] }); }
  if (K.alto) F.push({ tag: "Ação", yel: true, big: nf(K.alto), small: `${brl(K.altoMrr)} de MRR`, text: `<b>${K.alto} ${lvl} ativas</b> têm score de ${CUT.alto} ou mais: se parecem com quem já saiu. Outras ${K.atencao} pedem atenção (${CUT.atencao} a ${CUT.alto}).`, page: "acao",
    steps: [{ t: "O mesmo score, agora nas ativas", p: `Comparadas com ativas do mesmo ${(D.peerDim || "perfil").toLowerCase()}.` }, { t: "Corte de alto risco", calc: `score ≥ ${CUT.alto} → ${K.alto} ${lvl}\nscore ${CUT.atencao}–${CUT.alto} → ${K.atencao}` }, { t: "Somar o MRR em jogo", calc: `${brl(K.altoMrr)} nas de alto risco` }] });
  if (D.csm) { const top = D.csm.rows.find(r => r.n >= 10 && r.ratio >= 1.2);
    if (top) F.push({ tag: "Carteira", big: nf(top.ratio, 2) + "×", small: `${esc(top.k)}: real ÷ esperado`, text: `A carteira de <b>${esc(top.k)}</b> teve ${top.ch} cancelamentos, quando o perfil dos clientes (${D.csm.mix.join(" × ").toLowerCase()}) previa ${nf(top.exp, 1)}.`, page: "onde",
      steps: [{ t: `Taxa de churn de cada ${D.csm.mix.join(" × ").toLowerCase()}`, p: "Calculada na base inteira." }, { t: "Churn esperado da carteira", calc: `soma das taxas das ${top.n} ${lvl} = ${nf(top.exp, 1)}` }, { t: "Comparar com o real", calc: `${top.ch} ÷ ${nf(top.exp, 1)} = ${nf(top.ratio, 2)}×`, p: "Acima de 1, a carteira perdeu mais do que o mix explica." }] }); }
  if (D.hierarchy && D.hierarchy.partial) { const h = D.hierarchy;
    F.push({ tag: "Hierarquia", big: nf(h.partial), small: `de ${h.multi} organizações com 2+ produtos`, text: `<b>${h.partial} organizações</b> seguem ativas mas já cancelaram algum produto (${brl(K.partialLost)} de MRR). Produto que mais sai nesses casos: <b>${esc(h.firstProduct[0] ? h.firstProduct[0][0] : "—")}</b>.`, page: "onde",
      steps: [{ t: "Juntar os produtos por organização", calc: `${h.orgs} organizações · ${h.multi} com 2+ produtos` }, { t: "Organização parcial", p: "Tem produto cancelado e produto ativo ao mesmo tempo." }, { t: "Resultado", calc: `${h.partial} parciais · ${h.fullChurnMulti} perderam todos os produtos` }] }); }
  return F.slice(0, 6);
}

const RAMP = ["#0f2a4a", "#123661", "#154378", "#1a5190", "#2060a8", "#2a70c0", "#3987e5", "#5598e7", "#6da7ec", "#86b6ef", "#9ec5f4", "#b7d3f6"];

let scoreCut = 65;
function cutStats(t) {

}
function updateCut() {
  const q = D.quality; if (!q || !q.scores) return;

  if (res) res.innerHTML = `<div><b>${c.flagged}</b><span>${lvl} marcadas</span></div><div><b>${c.tp} de ${q.P}</b><span>canceladas encontradas (${pct(c.recall, 0)})</span></div><div><b>${pct(c.precision, 0)}</b><span>precisão: das marcadas, quantas cancelaram</span></div><div><b>${c.fp}</b><span>ativas marcadas (${pct(c.fpr, 0)} das ativas)</span></div>`;
  const roc = charts["ch-roc"]; if (roc) { roc.data.datasets[2].data = [{ x: c.fpr, y: c.recall }]; roc.update("none"); }
  const hist = charts["ch-hist"]; if (hist) { hist.options.plugins.refLineX.value = scoreCut / 10 - .5; hist.options.plugins.refLineX.label = `corte ${scoreCut}`; hist.update("none"); }
}

    options: { $xTitle: "Ativas marcadas por engano", $xLabel: x => pct(x, 0), scales: { x: { type: "linear", min: 0, max: 1, title: { display: true, text: "ativas marcadas por engano" }, ticks: { callback: v => nf(v * 100) + "%" }, grid: { color: C.line } }, y: { ...pctAxis(1), title: { display: true, text: "canceladas encontradas" } } }, plugins: { tooltip: { callbacks: { label: i => i.datasetIndex === 2 ? `Corte ${scoreCut}: ${pct(i.parsed.y, 0)} encontradas · ${pct(i.parsed.x, 0)} alarmes` : `${pct(i.parsed.y, 0)} encontradas · ${pct(i.parsed.x, 0)} alarmes` } } } } }, v => pct(v, 0));
  mk("ch-dec", { type: "bar", data: { labels: q.deciles.map((d, i) => `${i + 1}º`), datasets: [{ label: "Taxa de churn", data: q.deciles.map(d => d.n ? d.ch / d.n : 0), backgroundColor: q.deciles.map((d, i) => i < 2 ? C.crit : C.canc), borderRadius: 4, maxBarThickness: 40 }] },
    options: { plugins: { legend: { display: false }, refLineY: { value: K.rate, label: `base ${pct(K.rate)}` }, tooltip: { callbacks: { label: i => { const d = q.deciles[i.dataIndex]; return `${pct(d.ch / d.n)} · ${d.ch} de ${d.n} · score ≥ ${Math.round(d.min * 100)}`; } } } }, $xTitle: "Décimo do score", scales: { x: { grid: { display: false } }, y: pctAxis(1) } } }, v => pct(v));
  const tot = a => a.reduce((x, y) => x + y, 0) || 1;
  mk("ch-hist", { type: "bar", data: { labels: q.histActive.map((x, i) => `${i * 10}–${i * 10 + 10}`), datasets: [{ label: "Ativas", data: q.histActive.map(v => v / tot(q.histActive)), backgroundColor: C.ativo, borderRadius: 3 }, { label: "Canceladas", data: q.histChurned.map(v => v / tot(q.histChurned)), backgroundColor: C.canc, borderRadius: 3 }] },
    options: { $xTitle: "Faixa de score", interaction: { mode: "index", intersect: false }, plugins: { refLineX: { value: scoreCut / 10 - .5, label: `corte ${scoreCut}` }, tooltip: { callbacks: { label: i => `${i.dataset.label}: ${pct(i.parsed.y, 0)}` } } }, scales: { x: { grid: { display: false }, title: { display: true, text: "score" } }, y: pctAxis() } } }, v => pct(v, 0));
  updateCut();
};

let riskSort = { k: "risk", dir: -1 }, riskQ = "";
const chip = cls => cls === "alto" ? `<span class="chip crit">▲ Alto risco</span>` : cls === "atencao" ? `<span class="chip warn">◆ Atenção</span>` : "";
const scoreBar = r => `<span class="score"><i><b style="width:${Math.round(r * 100)}%;background:${r >= .7 ? C.crit : C.warn}"></b></i>${Math.round(r * 100)}</span>`;
function riskTable() {
  const q = riskQ.trim().toLowerCase();
  const rows = D.atRisk.filter(c => !q || [c.nome, c.id, c.setor, c.porte, c.csm].join(" ").toLowerCase().includes(q))
    .sort((a, b) => { const x = a[riskSort.k], y = b[riskSort.k]; return (typeof x === "string" || typeof y === "string" ? String(x ?? "").localeCompare(String(y ?? "")) : (x ?? -1) - (y ?? -1)) * riskSort.dir; });
  const cols = [["nome", "Cliente"], ["setor", D.segDim || "Setor"], ["porte", D.peerDim || "Porte"], ["csm", "CSM"], ["mrr", "MRR", 1], ["tenure", "Casa", 1], ["risk", "Score"], ["sinais", "Sinais"]];
  return `<table><thead><tr>${cols.map(([k, l, n]) => k === "sinais" ? `<th>${l}</th>` : `<th class="sort${n ? " n" : ""}" data-sort="${k}" tabindex="0" aria-sort="${riskSort.k === k ? (riskSort.dir > 0 ? "ascending" : "descending") : "none"}">${l}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(c => `<tr><td class="one" title="${esc(c.nome)}">${esc(c.nome)}${c.lines > 1 ? `<span class="sub mono">${c.lines} produtos${c.linesCanc ? ` · ${c.linesCanc} cancelado(s)` : ""}</span>` : ""}</td><td class="one">${esc(c.setor || "—")}</td><td>${esc(c.porte || "—")}</td><td class="one">${esc(c.csm || "—")}</td><td class="n">${brl(c.mrr)}</td><td class="n">${nf(c.tenure, 1)} m</td><td style="white-space:nowrap">${scoreBar(c.risk)} ${chip(c.cls)}</td><td class="one muted" title="${esc(c.sinais)}">${esc(c.sinais || "—")}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">Nenhum cliente encontrado.</td></tr>`}</tbody></table>`;
}
R.acao = () => {
  const A = D.anomalies;
  return `<div class="page-head"><span class="eyebrow">Página 6 · Ação</span>
      <h2>${K.alto} ${lvl} para priorizar agora e ${K.anormal} cancelamentos para entender.</h2>
      <p class="lead">A lista traz as ativas com score de ${CUT.atencao} ou mais, do maior risco ao menor, com os KPIs que puxam o score. Os cartões vermelhos são os cancelamentos que os números não anteciparam.</p></div>
    <div class="card"><div class="tools"><h3>Ativas em risco · ${D.atRisk.length}</h3><input type="search" id="riskQ" placeholder="Buscar cliente, setor, CSM…" aria-label="Buscar na lista" value="${esc(riskQ)}"></div>
      <div class="scroll" id="riskTable">${riskTable()}</div>
      ${how([`Score = média ponderada dos percentis da ${one} em cada KPI, entre as ativas do mesmo ${esc((D.peerDim || "perfil").toLowerCase())}.`, `Sinais: os KPIs em que a ${one} está entre os 25% piores dos pares (p = percentil).`, `Clique no cabeçalho para ordenar.`])}</div>
    ${A.length ? `<div class="card"><div class="card-h"><h3>Cancelamentos anormais</h3><p class="muted">cancelaram com indicadores saudáveis</p></div>
      <div class="anoms">${A.map(c => `<article class="anom"><h3>${esc(c.nome)}</h3><div class="row"><span>${esc(c.setor || "")}</span><span>${esc(c.porte || "")}</span><span>${esc(c.csm || "")}</span><span>${brl(c.mrr)}</span></div>
        <div class="row"><span>cancelou ${date(c.dataCanc)}</span><span>${nf(c.tenure, 1)} meses de casa</span><span>score ${Math.round(c.risk * 100)}</span></div>
        <p class="q">${esc(c.motivo || "(sem motivo)")}${c.descricao ? ` · <span class="muted">${esc(c.descricao)}</span>` : ""}</p><p class="k">KPIs antes de sair: ${esc(c.sinais || "na média das ativas")}</p></article>`).join("")}</div>
      ${how([`Score abaixo de ${CUT.anormal} com a última leitura antes do cancelamento: a ${one} parecia mais saudável que a média das ativas pares.`, `Esses casos não aparecem em alerta de KPI. Vale entender cada um com o CSM: decisão da diretoria, aquisição, corte de orçamento.`])}</div>` : ""}
    <div class="card"><div class="card-h"><h3>Motivo x classificação</h3><p class="muted">quais motivos os KPIs conseguem antecipar · clique na legenda para isolar</p></div><div class="chart"><canvas id="ch-mot" role="img" aria-label="Motivos por classificação"></canvas></div></div>
    ${nextBtn("acao")}`;
};
R.acao.charts = () => {
  const r = D.reasons;
  mk("ch-mot", { type: "bar", data: { labels: r.map(x => x.k), datasets: [{ label: "Anormal", data: r.map(x => x.anormal), backgroundColor: C.crit }, { label: "Sinais fracos", data: r.map(x => x.fraco), backgroundColor: C.warn }, { label: "Esperado", data: r.map(x => x.esperado), backgroundColor: C.muted }] },
    options: { $xTitle: "Motivo", indexAxis: "y", interaction: { mode: "index", intersect: false }, scales: { x: { stacked: true, beginAtZero: true, ticks: { precision: 0 } }, y: { stacked: true, grid: { display: false } } } } }, v => nf(v));
};

R.dados = () => {
  const q = D.dataQuality, m = q.mapping;
  const used = [...Object.values(m.clientes || {}), ...Object.values(m.kpis || {})].filter(Boolean);
  return `<div class="page-head"><span class="eyebrow">Página 7 · Dados e método</span>
      <h2>De onde vêm os números e o quanto confiar neles.</h2>
      <p class="lead">${D.isSample ? `<span class="bad">Este painel usa dados de exemplo fictícios.</span> ` : ""}Gerado em ${date(D.generatedAt)} a partir de ${nf(q.rowsCustomer)} linhas de <code>customer</code> e ${nf(q.kpiRows)} leituras de <code>kpi</code> (${date(q.kpiFrom)} a ${date(q.kpiTo)}).</p></div>
    <div class="steps-line">
      <div><b>Ler</b>customer e kpi, reconhecendo as colunas pelo nome.</div>
      <div><b>Hierarquia</b>linhas de produto somadas por organização.</div>
      <div><b>Leitura certa</b>último KPI antes de <code>dt_cancel</code>.</div>
      <div><b>Comparar</b>ativas x canceladas e o efeito de cada KPI.</div>
      <div><b>Score</b>percentil entre pares, ponderado pelo efeito.</div>
      <div><b>Validar</b>ROC, décimos e cortes.</div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-h"><h3>Completude</h3><p class="muted">% das linhas de cliente com o campo preenchido</p></div>
        <div class="bars">${q.completeness.filter(c => c[1] != null).map(([k, v]) => `<div class="barline"><span>${esc(k)}</span><span class="t"><b data-w="${Math.round(v * 100)}" style="background:${v >= .95 ? C.accent : v >= .8 ? C.warn : C.crit}"></b></span><span class="p">${pct(v, 0)}</span></div>`).join("")}</div>
        ${Object.keys(q.typeCounts).length ? `<p class="note">hierarchy_type: ${Object.entries(q.typeCounts).map(([k, v]) => `${esc(k)} ${nf(v)}`).join(" · ")}</p>` : ""}</div>
      <div class="card"><div class="card-h"><h3>Colunas usadas</h3></div>
        <div class="chips">${used.map(u => `<span class="pill">${esc(u)}</span>`).join("")}</div>
        ${q.warnings.length || q.notes.length ? `<p class="note">${q.warnings.concat(q.notes).map(esc).join("<br>")}</p>` : ""}
        <h3 style="margin-top:6px">Gerar com os seus dados</h3>
        <pre class="cmd">node tools/gerar_diagnostico.mjs customer.csv kpi.csv</pre>
        <p class="note">O script usa o mesmo motor do relatório interativo, então os números batem com ele. Exporte os CSVs com as consultas de <code>sql/</code>.</p></div>
    </div>
    <div class="card"><div class="card-h"><h3>Limites desta análise</h3></div>
      <ol class="muted" style="margin:0;padding-left:18px;display:grid;gap:6px;font-size:.88rem">
        <li>O score é avaliado nos mesmos dados que o geraram. A AUC real tende a ser menor; o teste definitivo é calcular o score em datas passadas.</li>
        <li>O churn é medido por <code>dt_cancel</code>. Reativações, suspensões e status sem data não entram.</li>
        <li>Grupos pequenos têm taxas instáveis; por isso só marcamos diferenças com z ≥ 1,96.</li>
        <li>Correlação não é causa: um KPI que antecipa o churn pode ser sintoma, não motivo.</li>
      </ol></div>
    ${nextBtn("dados")}`;
};
R.dados.charts = () => requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll(".barline b[data-w]").forEach(b => b.style.width = b.dataset.w + "%")));

/* ---------- navegação ---------- */
function go(id, scroll = true) {
  if (!R[id]) id = "diag";
  $("#tabs").innerHTML = PAGES.map(([k, l], i) => `<button type="button" class="pg" role="tab" id="tab-${k}" aria-controls="panel" tabindex="${k === id ? 0 : -1}" data-go="${k}" aria-selected="${k === id}"><b>${String(i + 1).padStart(2, "0")}</b>${l}</button>`).join("");
  const main = $("#main");
  main.innerHTML = `<section class="page" role="tabpanel" id="panel" aria-labelledby="tab-${id}">${R[id]()}</section>`;
  if (R[id].charts) R[id].charts();
  countUp(main); initSteppers(main);
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  if (scroll) window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
  const tab = $(`.pg[data-go="${id}"]`); if (tab) tab.scrollIntoView({ block: "nearest", inline: "center" });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (b) { go(b.dataset.go); return; }
  const os = e.target.closest("[data-osort]"); if (os) { ondeSort = os.dataset.osort; document.querySelectorAll("[data-osort]").forEach(x => x.setAttribute("aria-pressed", String(x === os))); R.onde.charts(); return; }
  const d = e.target.closest("[data-dim]"); if (d) { ondePick = null; ondeDim = d.dataset.dim === "prod" ? "prod" : +d.dataset.dim; document.querySelectorAll("[data-dim]").forEach(x => x.setAttribute("aria-pressed", String(x === d))); R.onde.charts(); return; }
  const th = e.target.closest("th[data-sort]"); if (th) { const k = th.dataset.sort; riskSort = { k, dir: riskSort.k === k ? -riskSort.dir : (["nome", "setor", "porte", "csm"].includes(k) ? 1 : -1) }; $("#riskTable").innerHTML = riskTable(); }
});
document.addEventListener("keydown", e => {
  const pg = e.target.closest && e.target.closest(".pg"); if (!pg || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
  const i = PAGES.findIndex(x => x[0] === pg.dataset.go), n = PAGES[(i + (e.key === "ArrowRight" ? 1 : -1) + PAGES.length) % PAGES.length][0];
  e.preventDefault(); go(n, false); const t = $(`.pg[data-go="${n}"]`); if (t) t.focus();
});
document.addEventListener("keydown", e => { const th = e.target.closest && e.target.closest("th[data-sort]"); if (th && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); th.click(); } });
document.addEventListener("input", e => { if (e.target.id === "riskQ") { riskQ = e.target.value; $("#riskTable").innerHTML = riskTable(); } });
const tip = $("#tip");
document.addEventListener("mousemove", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (!el) { tip.hidden = true; return; } tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14; tip.style.left = x + "px"; tip.style.top = y + "px"; });


/* ---------- tour do painel ---------- */
const DTOUR_KEY = "csops-diag-tour", DTOUR_V = 1;
const dtour = () => { try { const t = JSON.parse(localStorage.getItem(DTOUR_KEY) || "null"); return t && t.v === DTOUR_V ? t : null; } catch (e) { return null; } };
function runDiagTour(opener) {
  const Drv = window.driver && window.driver.js && window.driver.js.driver; if (!Drv) return;
  if (!$(".finds")) go("diag", false);
  const steps = [
    { element: ".page-head", popover: { title: "A conclusão vem primeiro", description: "Cada página abre com a frase que resume o achado. Os números abaixo dela sustentam essa frase." } },
    { element: ".flow", popover: { title: "Do arquivo ao diagnóstico", description: "O caminho dos dados: linhas lidas, hierarquia, nível de análise, ativas e canceladas, e o que o score encontrou." } },
    { element: ".find .stepper", popover: { title: "Como chegamos aqui", description: "Cada achado mostra o cálculo passo a passo, sozinho. Passe o mouse para pausar ou use ‹ › para avançar." } },
    { element: "#tabs", popover: { title: "Sete páginas, uma história", description: "Retenção, onde está o churn, sinais, qualidade do score, ação e método. Em todo gráfico há <b>Ver como tabela</b>." } }
  ];
  let ended = null;
  const t = Drv({
    steps, showProgress: true, progressText: "{{current}} de {{total}}", showButtons: ["next"], nextBtnText: "Entendi", doneBtnText: "Começar",
    allowClose: true, smoothScroll: !REDUCED, animate: false, overlayColor: "#000", overlayOpacity: 0.6, stagePadding: 8, stageRadius: 12, popoverClass: "csops-tour",
    onPopoverRender: (pop, { state: st }) => {
      const last = st.activeIndex === steps.length - 1;
      pop.wrapper.setAttribute("role", "dialog"); pop.wrapper.setAttribute("aria-modal", "true"); pop.title.id = "dtTitle"; pop.wrapper.setAttribute("aria-labelledby", "dtTitle");
      const skip = document.createElement("button"); skip.type = "button"; skip.className = "tour-skip"; skip.textContent = "Pular";
      skip.addEventListener("click", () => { ended = "skipped"; t.destroy(); });
      skip.style.order = "-1"; if (!last) pop.footerButtons.append(skip);
      setTimeout(() => pop.nextButton && pop.nextButton.focus({ preventScroll: true }), 160);
    },
    onNextClick: () => { if (t.isLastStep()) { ended = "done"; t.destroy(); } else t.moveNext(); },
    onDestroyed: () => {
      try { localStorage.setItem(DTOUR_KEY, JSON.stringify({ v: DTOUR_V, status: ended || "skipped", at: new Date().toISOString() })); } catch (e) {}
      if (ended === "done") window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
      if (opener && document.body.contains(opener)) opener.focus();
    }
  });
  t.drive();
}
document.addEventListener("click", e => {
  if (e.target.id === "btnTour") runDiagTour(e.target);
  if (e.target.id === "useSample") { try { localStorage.removeItem("csops-diag-data"); } catch (err) {} location.reload(); }
});
if (!dtour()) setTimeout(() => runDiagTour(null), 1400);

$("#toReport").href = REPORT_URL;
$("#meta").innerHTML = [STORED ? `<span class="pill src">dados do relatório · ${new Date(STORED.savedAt).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}<button type="button" id="useSample">usar exemplo</button></span>` : "", D.isSample ? `<span class="pill sample">dados de exemplo fictícios</span>` : "", (D.filters || []).length ? `<span class="pill">recorte: ${esc(D.filters.join(" · "))}</span>` : "", `<span class="pill">corte ${date(K.ref)}</span>`, `<span class="pill">nível: ${esc(lvl)}</span>`, D.peerDim ? `<span class="pill">pares: ${esc(D.peerDim.toLowerCase())}</span>` : "", `<span class="pill">gerado ${date(D.generatedAt)}</span>`].join("");
go((location.hash || "").replace("#", "") || "diag", false);
window.addEventListener("hashchange", () => go(location.hash.replace("#", "") || "diag"));
</script>
</body>
</html>
